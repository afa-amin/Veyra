[package]
name = "veyra-core"
version = "0.2.0"
edition = "2021"
description = "Veyra cryptographic core"
license = "MIT"

[dependencies]
# The pairing crate is pinned exactly: the Gt-to-bytes key derivation in
# `scheme.rs` depends on the crate's canonical element encoding.
bls12_381 = { version = "=0.8.0", features = ["experimental"] }
group = "0.13"
ff = "0.13"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.8"
rand = "0.8.5"
rand_core = "0.6.4"
zeroize = "1.5.7"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
chrono = { version = "0.4.31", features = ["serde"] }
thiserror = "1.0.56"
hex = "0.4.3"
subtle = "2.5.0"
